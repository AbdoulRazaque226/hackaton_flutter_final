name: proxserv
description: "Une plateforme de mise en relation avec des professionnels de proximité."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  uuid: ^4.6.0
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  url_launcher: ^6.3.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/categories/
    - assets/images/hero/
    - assets/audio/
    - assets/sounds/